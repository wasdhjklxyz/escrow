name: ci
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: build
        run: nix build -L
      - name: format
        run: nix develop -c sh -c 'git ls-files "*.c" "*.h" | xargs -r clang-format --dry-run --Werror'
